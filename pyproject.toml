[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrnova"
version = "0.1.0"
description = "Pyrnova — economic and commercial intelligence. Capture Radar kernel."
# Verified runtime floor: CPython 3.9 (the release-candidate fresh-install verification runs green on
# 3.9.6; the code uses no >=3.10-only runtime syntax). 3.11+ is the recommended production target. See
# docs/operations/RELEASE_INSTALL.md.
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
# Cloud/object-storage and Postgres are optional; the kernel runs fully local without them.
s3 = ["boto3>=1.34"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0"]

[project.scripts]
pyrnova = "pyrnova.cli:main"

[tool.setuptools.packages.find]
include = ["pyrnova*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
