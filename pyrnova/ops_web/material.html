<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pyrnova — Material Changes</title>
  <link rel="stylesheet" href="/material.css?v=1">
  <link rel="stylesheet" href="/access.css?v=1">
</head>
<body>
  <header class="masthead">
    <div class="brand"><span class="mark">PYRNOVA</span><span class="module">Material Changes</span></div>
    <div class="controls">
      <!-- Authenticated organization identity (§36). The customer is fixed by the credential; no tenant
           switching. The dev/operator selector below is shown only when the server exposes a choice. -->
      <span class="org-identity" id="org" hidden><span class="org-name"></span></span>
      <label class="field" id="customer-field" hidden>Customer<select id="customer"></select></label>
      <label class="field">As of<input id="asof" type="date"></label>
      <a class="console-link" href="/investigate">Search</a>
      <a class="console-link" id="console-link" href="/console" hidden>Operations</a>
      <button type="button" class="signout" id="signout" hidden>Sign Out</button>
    </div>
  </header>

  <main>
    <section class="lede">
      <h1>Material Changes</h1>
      <p class="question">What materially changed since you last looked, and why does it matter to this organization?</p>
      <div id="filters" class="filters"></div>
    </section>

    <div id="message" role="status" class="message" hidden></div>
    <section id="feed" class="feed"></section>
  </main>

  <template id="change">
    <article class="change">
      <div class="change-top">
        <span class="disposition"></span>
        <div class="badges">
          <span class="badge materiality" title="How severe the economic consequence could be, if the assessment holds"></span>
          <span class="badge confidence" title="How strongly retained evidence supports the assessment"></span>
        </div>
      </div>
      <h2 class="headline"></h2>
      <div class="why">
        <span class="why-label">Why it matters</span>
        <span class="why-detail"></span>
        <span class="relevance-basis"></span>
      </div>
      <div class="investigate" hidden></div>
      <div class="split">
        <div class="pane observed">
          <span class="pane-label">Observed fact</span>
          <dl class="facts"></dl>
        </div>
        <div class="pane assessed">
          <span class="pane-label">Pyrnova assessment</span>
          <dl class="facts"></dl>
        </div>
      </div>
      <div class="propagation" hidden></div>
      <div class="evidence"></div>
      <div class="uncertainty" hidden></div>
      <div class="change-foot">
        <span class="status"></span>
        <div class="foot-actions">
          <button type="button" class="history" hidden>Version history</button>
          <button type="button" class="inspect">Evidence references</button>
        </div>
      </div>
      <div class="first-seen" hidden></div>
      <div class="review">
        <span class="review-label">Your review<b class="review-state"></b></span>
        <div class="review-actions"></div>
      </div>
      <div class="versions" hidden></div>
      <pre class="refs" hidden></pre>
    </article>
  </template>

  <script src="/access.js?v=1" defer></script>
  <script src="/material.js?v=1" defer></script>
</body>
</html>
