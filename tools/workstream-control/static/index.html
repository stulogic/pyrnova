<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pyrnova Workstream Control</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>PYRNOVA WORKSTREAM CONTROL</h1>
      <div class="counters" id="counters">
        <div class="counter"><span class="cnum" id="c-ready">0</span><span class="clabel">READY</span></div>
        <div class="counter"><span class="cnum" id="c-active">0</span><span class="clabel">ACTIVE</span></div>
        <div class="counter"><span class="cnum" id="c-blocked">0</span><span class="clabel">BLOCKED</span></div>
        <div class="counter"><span class="cnum" id="c-closed">0</span><span class="clabel">CLOSED</span></div>
        <div class="counter"><span class="cnum" id="c-superseded">0</span><span class="clabel">SUPERSEDED</span></div>
      </div>
    </div>
    <div class="viewbar">
      <div class="seg" id="viewseg">
        <button data-view="operational" class="active">OPERATIONAL</button>
        <button data-view="archive">ARCHIVE</button>
        <button data-view="all">ALL</button>
      </div>
      <button id="btn-import" class="ghost">IMPORT</button>
    </div>
  </header>

  <section class="filters">
    <input type="search" id="f-search" placeholder="search id / name / objective" />
    <select id="f-category"><option value="">All categories</option></select>
    <select id="f-status"><option value="">All statuses</option></select>
    <select id="f-priority"><option value="">All priorities</option></select>
  </section>

  <section id="import-panel" class="import-panel" hidden>
    <div class="import-head">
      <strong>BULK IMPORT</strong>
      <span class="muted">Paste one workstream object or a JSON array. Nothing is imported until all conflicts are resolved.</span>
    </div>
    <textarea id="import-json" spellcheck="false" placeholder='[{"id":"PYR-EXAMPLE-001","canonical_name":"...","category":"PRODUCT","priority":"HIGH","objective":"...","prompt_body":"## Task ..."}]'></textarea>
    <div class="import-actions">
      <button id="btn-validate">VALIDATE</button>
      <button id="btn-commit" disabled>IMPORT</button>
      <button id="btn-import-close" class="ghost">CLOSE</button>
      <span id="import-summary" class="import-summary"></span>
    </div>
    <div id="import-results" class="import-results"></div>
  </section>

  <main id="cards" class="cards"></main>

  <div id="toast" class="toast" hidden>
    <div class="toast-title">PROMPT COPIED</div>
    <div class="toast-body">PASTE INTO CHATGPT AND PRESS ENTER</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
